<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#0f172a}
      .s{font-size:12px;fill:#334155}
      .h{font-size:13px;font-weight:700;fill:#64748b;letter-spacing:.06em}
      .ln{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .dl{stroke:#475569;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .lab{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1280" height="800" fill="#ffffff"/>

  <!-- Lanes -->
  <rect x="16" y="16" width="1248" height="200" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="40" class="h">OFFLINE · INGESTION (rsa ingest · rsa index)</text>
  <rect x="16" y="232" width="1248" height="420" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="256" class="h">ONLINE · REQUEST PATH (rsa ask · rsa chat · Streamlit)</text>
  <rect x="16" y="668" width="1248" height="116" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="692" class="h">EVALUATION &amp; OBSERVABILITY</text>

  <!-- Ingestion lane -->
  <rect x="32" y="56" width="250" height="144" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="46" y="80" class="t">Sources (data/raw)</text>
  <text x="46" y="102" class="s">Synthetic policies: MD · HTML · PDF</text>
  <text x="46" y="120" class="s">Public: FTC 16 CFR 435 (eCFR XML)</text>
  <text x="46" y="138" class="s">Synthetic ops: customers/orders CSV,</text>
  <text x="46" y="154" class="s">returns JSON</text>
  <text x="46" y="180" class="s">Provenance: data/sources.json</text>

  <rect x="330" y="56" width="280" height="144" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="344" y="80" class="t">Structure-aware chunker</text>
  <text x="344" y="102" class="s">Headings · lists · tables per format</text>
  <text x="344" y="120" class="s">≤512 tok, flush at H1/H2, overlap in-section</text>
  <text x="344" y="138" class="s">Table → whole chunk + one chunk per row</text>
  <text x="344" y="156" class="s">origin / synthetic / licence on each chunk</text>
  <text x="344" y="180" class="s">→ chunks.jsonl · manifest.json</text>

  <rect x="660" y="56" width="270" height="144" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="674" y="80" class="t">Qdrant (embedded)</text>
  <text x="674" y="102" class="s">dense: BGE-small-en-v1.5 (384-d)</text>
  <text x="674" y="120" class="s">sparse: BM25 with IDF</text>
  <text x="674" y="138" class="s">collection "policies"</text>
  <text x="674" y="156" class="s">payload = chunk + lineage</text>

  <rect x="980" y="56" width="268" height="144" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="994" y="80" class="t">PostgreSQL</text>
  <text x="994" y="102" class="s">customers · orders · returns</text>
  <text x="994" y="120" class="s">validated rows, FK integrity</text>
  <text x="994" y="138" class="s">never embedded; read via MCP only</text>
  <text x="994" y="156" class="s">(SQLite file in tests)</text>

  <path class="ln" d="M282,110 H328"/>
  <path class="ln" d="M610,110 H658"/>
  <path class="ln" d="M282,180 C 600,212 900,212 1100,202"/>
  <text x="300" y="226" class="lab">CSV/JSON loader → validated rows</text>

  <!-- Request lane -->
  <rect x="32" y="280" width="170" height="92" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="306" class="t">Customer</text>
  <text x="46" y="328" class="s">question + signed-in</text>
  <text x="46" y="346" class="s">customer ID</text>

  <rect x="32" y="400" width="170" height="120" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="46" y="424" class="t">Input guardrails</text>
  <text x="46" y="446" class="s">rate limit</text>
  <text x="46" y="464" class="s">injection regex + DeBERTa</text>
  <text x="46" y="482" class="s">toxicity regex + BERT</text>
  <text x="46" y="500" class="s">semantic cache lookup</text>
  <path class="ln" d="M117,372 V398"/>

  <rect x="250" y="280" width="390" height="352" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="266" y="306" class="t">SupportAgent — LangGraph tool loop</text>
  <text x="266" y="328" class="s">agent node picks the next tool each turn (≤ 8 steps)</text>
  <text x="266" y="346" class="s">state: messages · evidence list · tool-guard budgets</text>
  <rect x="266" y="362" width="358" height="66" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="280" y="384" class="t" style="font-size:13px">LLM: NVIDIA NIM nemotron (or Claude)</text>
  <text x="280" y="404" class="s">tool schemas + system prompt cached as a</text>
  <text x="280" y="420" class="s">byte-stable prefix; usage recorded per turn</text>
  <rect x="266" y="440" width="358" height="80" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="280" y="462" class="t" style="font-size:13px">Tool-call guard</text>
  <text x="280" y="482" class="s">schema + order-ID validation · per-tool budgets</text>
  <text x="280" y="500" class="s">no create_return before lookup · output PII</text>
  <text x="280" y="516" class="s">redaction and injection neutralising</text>
  <rect x="266" y="532" width="358" height="84" rx="6" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="280" y="554" class="t" style="font-size:13px">Output guardrails + live grounding</text>
  <text x="280" y="574" class="s">NLI faithfulness · fabricated-number check</text>
  <text x="280" y="592" class="s">prompt-leak · off-scope · other-customer IDs</text>
  <text x="280" y="608" class="s">→ answer with cited sources</text>
  <path class="ln" d="M202,460 H248"/>

  <rect x="700" y="280" width="250" height="168" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="714" y="304" class="t">search_policies (local)</text>
  <text x="714" y="326" class="s">1. dense + BM25 in Qdrant</text>
  <text x="714" y="344" class="s">2. RRF fusion (k = 60)</text>
  <text x="714" y="362" class="s">3. cross-encoder rerank</text>
  <text x="714" y="378" class="s">   bge-reranker-base, ≤10 cands</text>
  <text x="714" y="396" class="s">4. top-7 + grounded flag +</text>
  <text x="714" y="412" class="s">   source_kind (store / federal)</text>
  <text x="714" y="434" class="s">exact LRU retrieval cache</text>

  <rect x="700" y="470" width="250" height="162" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="714" y="494" class="t">MCP client (stdio)</text>
  <text x="714" y="516" class="s">JSON-RPC over stdio; sync facade</text>
  <text x="714" y="534" class="s">spawns server per session with</text>
  <text x="714" y="552" class="s">RSA_REQUESTER_ID = customer</text>
  <text x="714" y="570" class="s">(identity is never a tool argument)</text>

  <rect x="990" y="470" width="258" height="162" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1004" y="494" class="t">MCP server "retail-ops"</text>
  <text x="1004" y="516" class="s">get_order_details</text>
  <text x="1004" y="534" class="s">get_return_refund_status</text>
  <text x="1004" y="552" class="s">create_return_request</text>
  <text x="1004" y="570" class="s">create_escalation_ticket</text>
  <text x="1004" y="592" class="s">Pydantic inputs · ownership check</text>
  <text x="1004" y="610" class="s">{ok:false, error:{code, retryable}}</text>

  <path class="ln" d="M640,380 H698"/>
  <path class="ln" d="M640,540 H698"/>
  <path class="ln" d="M950,550 H988"/>
    <path class="dl" d="M795,280 V202"/>
  <text x="802" y="240" class="lab">query</text>
  <path class="dl" d="M1119,470 V202"/>
  <text x="1126" y="340" class="lab">SQL (ops.py)</text>

  <!-- Eval lane -->
  <rect x="32" y="704" width="300" height="66" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="46" y="728" class="t">Traces</text>
  <text x="46" y="748" class="s">JSONL per request: step, latency, TTFT, tokens</text>
  <text x="46" y="764" class="s">+ Langfuse spans when configured</text>
  <rect x="350" y="704" width="300" height="66" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="364" y="728" class="t">Retrieval eval (50 labelled Qs)</text>
  <text x="364" y="748" class="s">dense vs BM25 vs hybrid vs +rerank</text>
  <text x="364" y="764" class="s">doc + evidence Hit@k, MRR, nDCG</text>
  <rect x="668" y="704" width="300" height="66" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="682" y="728" class="t">Agent eval (28 cases)</text>
  <text x="682" y="748" class="s">facts · tools · safety (deterministic)</text>
  <text x="682" y="764" class="s">+ G-Eval judge, faithfulness</text>
  <rect x="986" y="704" width="262" height="66" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="1000" y="728" class="t">rsa cost-report</text>
  <text x="1000" y="748" class="s">tokens, stage latency, TTFT,</text>
  <text x="1000" y="764" class="s">cost sensitivity</text>
  <path class="dl" d="M445,632 C 445,690 320,684 300,702"/>
</svg>
